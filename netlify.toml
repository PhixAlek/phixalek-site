[build]
  command = "npm run build"
  publish = "dist"

# Cache largo para imágenes (1 año)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache corto para el JSON (para que tomes cambios rápido)
[[headers]]
  for = "/data/images.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

# (Opcional) SPA fallback si usas rutas de cliente
#[[redirects]]
#  from = "/*"
#  to = "/index.html"
#  status = 200

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[context.deploy-preview.environment]
  NPM_FLAGS = "--include=dev"

[dev]
  command    = "npm run dev:web"   # tu webpack serve
  port       = 8888            # puerto público de Netlify Dev
  targetPort = 5173            # donde corre webpack
  framework  = "#custom"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["googleapis"]

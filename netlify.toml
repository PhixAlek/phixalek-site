[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "true"
  # Timezone names are public configuration, not credentials.
  SECRETS_SCAN_OMIT_KEYS = "DEFAULT_TZ"

[context.deploy-preview.environment]
  NPM_FLAGS = "--include=dev"

[dev]
  command    = "npm run dev:web"   # tu webpack serve
  port       = 8888            # puerto público de Netlify Dev
  targetPort = 5173            # donde corre webpack
  framework  = "#custom"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["googleapis"]
